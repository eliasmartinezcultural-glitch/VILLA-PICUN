<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173d50"><title>Villa Picún — Una historia para jugar</title>
<style>
:root{--ink:#173d50;--cream:#fff7df;--sky:#8ed7e8;--sand:#dfbd7b;--green:#668b5d;--water:#45a8c3;--sun:#ffd45b;--white:#fff;--red:#c96b55}
*{box-sizing:border-box}html,body{margin:0;background:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button{font:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}.top{height:68px;padding:9px 13px;display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;z-index:50}.brand{font-size:clamp(18px,5vw,30px);font-weight:1000;letter-spacing:-1px}.brand b{color:var(--sun)}.topRight{display:flex;gap:7px;align-items:center}.stars,.menuBtn{background:#fff;color:var(--ink);font-weight:1000;border:3px solid var(--sun);border-radius:999px;padding:7px 11px}.menuBtn{cursor:pointer;min-width:46px}
.world{position:relative;min-height:710px;flex:1;overflow:hidden;background:linear-gradient(var(--sky) 0 49%,var(--sand) 49% 70%,var(--water) 70%)}.sun{position:absolute;right:8%;top:6%;width:78px;height:78px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 12px #ffd45b44}.barda{position:absolute;bottom:40%;left:-12%;width:76%;height:27%;background:var(--green);border-radius:55% 55% 0 0}.barda.two{left:44%;width:68%;height:23%;background:#557a58;transform:rotate(3deg)}.river{position:absolute;bottom:0;width:100%;height:30%;background:var(--water);border-top:5px solid #e7fafb88}.river:after{content:"";position:absolute;top:25%;left:7%;width:18%;height:5px;border-radius:9px;background:#fff9;box-shadow:180px 32px #fff7,430px 5px #fff6}.road{position:absolute;bottom:20%;left:39%;width:25%;height:48%;background:#d4ab67;transform:skew(-12deg);border-radius:45% 45% 0 0}.reed{position:absolute;bottom:27%;width:7px;height:60px;background:#486d4b;border-radius:8px;box-shadow:15px 13px #486d4b,-14px 8px #486d4b}.reed.a{left:13%}.reed.b{right:14%}.sign{position:absolute;z-index:5;left:8%;bottom:32%;background:var(--cream);border:4px solid var(--ink);border-radius:12px;padding:7px 11px;font-weight:1000;box-shadow:0 5px #173d5033}.chacra{position:absolute;z-index:4;right:9%;bottom:34%;font-size:46px}.tree{position:absolute;z-index:4;right:26%;bottom:34%;font-size:54px}
.character{position:absolute;z-index:12;left:43%;bottom:29%;width:100px;height:125px;cursor:pointer;animation:float 1.8s ease-in-out infinite}.head{position:absolute;left:25px;top:13px;width:52px;height:52px;border-radius:50%;background:#d99b68;border:5px solid var(--ink)}.hair{position:absolute;left:25px;top:9px;width:52px;height:25px;background:#50382e;border:5px solid var(--ink);border-radius:50% 50% 35% 35%;z-index:2}.body{position:absolute;left:17px;top:64px;width:68px;height:56px;background:#c76d55;border:5px solid var(--ink);border-radius:24px}.leg{position:absolute;bottom:0;width:17px;height:38px;background:#384957;border:4px solid var(--ink);border-radius:10px}.leg.l{left:29px}.leg.r{right:29px}@keyframes float{50%{transform:translateY(-8px) rotate(1deg)}}
.mission{position:absolute;z-index:15;left:50%;top:15px;transform:translateX(-50%);width:min(92%,690px);background:#fffdf4;border:4px solid var(--ink);border-radius:20px;padding:10px 14px;box-shadow:0 7px #173d5030}.missionLine{display:flex;justify-content:space-between;gap:10px;align-items:center}.mission strong{font-size:15px}.mission small{font-weight:850}.bar{height:8px;background:#dbe5e3;border-radius:99px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--sun);transition:.25s}
.hud{position:absolute;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);width:min(96%,780px);display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.action{min-height:67px;border:4px solid var(--ink);border-radius:18px;background:#fff;color:var(--ink);font-weight:1000;box-shadow:0 6px #173d5033;cursor:pointer}.action:active{transform:translateY(4px);box-shadow:0 2px #173d5033}.action small{display:block;font-size:10px}
.panel,.menu{position:absolute;z-index:60;left:50%;top:8%;transform:translateX(-50%);width:min(93%,680px);background:#fffdf4;border:4px solid var(--ink);border-radius:25px;padding:17px;box-shadow:0 12px 0 #173d5033;text-align:center;display:none}.panel.show,.menu.show{display:block;animation:pop .2s}.panel h1,.menu h1{font-size:clamp(21px,5vw,31px);margin:0 0 6px}.panel p{margin:0;font-size:16px;font-weight:650;line-height:1.4}.close{margin-top:12px;width:100%;min-height:45px;background:var(--sun);border:3px solid var(--ink);border-radius:15px;font-weight:1000;cursor:pointer}
.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.menuItem{min-height:65px;background:#fff;border:3px solid var(--ink);border-radius:16px;font-weight:1000;cursor:pointer}.menuItem span{display:block;font-size:11px;font-weight:700}.dialogue{text-align:left;background:#eaf5f4;border:3px solid var(--ink);border-radius:18px;padding:12px;margin-top:10px}.dialogue b{display:block;margin-bottom:4px}.choices{display:grid;gap:8px;margin-top:10px}.choice{border:3px solid var(--ink);background:#fff;border-radius:14px;padding:11px;text-align:left;font-weight:850;cursor:pointer}.fact{margin-top:10px;background:#fff2bd;border:3px dashed var(--ink);border-radius:14px;padding:10px;font-size:14px;font-weight:800}
.mini{position:absolute;z-index:45;left:50%;bottom:120px;transform:translateX(-50%);width:min(92%,520px);background:var(--cream);border:4px solid var(--ink);border-radius:20px;padding:13px;text-align:center;display:none}.mini.show{display:block}.targets{display:flex;justify-content:center;gap:18px;margin:10px 0}.target{font-size:38px;border:0;background:transparent;cursor:pointer;transition:.12s}.target:active{transform:scale(.8)}.toast{position:absolute;z-index:70;left:50%;bottom:100px;transform:translateX(-50%);background:var(--cream);border:3px solid var(--ink);border-radius:15px;padding:8px 13px;font-weight:950;display:none}
@keyframes pop{from{transform:translateX(-50%) scale(.82);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
footer{background:var(--cream);padding:9px;text-align:center;font-size:11px;font-weight:800}
@media(max-width:620px){.world{min-height:680px}.hud{grid-template-columns:1fr 1fr}.action{min-height:61px}.character{left:38%;transform:scale(.9)}.menuGrid{grid-template-columns:1fr 1fr}.sign{left:3%;font-size:11px}.chacra{right:3%;font-size:37px}.tree{right:22%;font-size:43px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand">VILLA <b>PICÚN</b></div><div class="topRight"><div class="stars" id="score">⭐ 0 / 6</div><button class="menuBtn" id="menuBtn" aria-label="Abrir menú">☰</button></div></header>
<section class="world">
<div class="sun"></div><div class="barda"></div><div class="barda two"></div><div class="road"></div><div class="river"></div><div class="reed a"></div><div class="reed b"></div><div class="sign">PICÚN LEUFÚ</div><div class="chacra">🌾🐑</div><div class="tree">🌳</div>
<div class="mission"><div class="missionLine"><strong>🎯 MISIÓN: conocer Picún Leufú</strong><small id="missionText">0 de 6</small></div><div class="bar"><i id="bar"></i></div></div>
<div class="character" id="hero" aria-label="Compañero de aventura"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div></div>
<div class="panel" id="panel"><h1 id="pt"></h1><p id="px"></p><div id="extra"></div><button class="close" id="close">¡Seguir jugando!</button></div>
<div class="mini" id="mini"><b>🎯 Mini misión: encontrá las 3 pistas</b><div class="targets"><button class="target" data-t="💧">💧</button><button class="target" data-t="👣">👣</button><button class="target" data-t="🌾">🌾</button></div><small>Tocá una por una.</small></div>
<div class="toast" id="toast">⭐ ¡Nuevo descubrimiento!</div>
<nav class="hud">
<button class="action" data-id="arroyo">💧<small>Arroyo</small>Explorar</button>
<button class="action" data-id="chacra">🌾<small>Chacras</small>Ayudar</button>
<button class="action" data-id="historia">🏘️<small>Historia</small>Viajar</button>
<button class="action" data-id="sauce">🌲<small>El Sauce</small>Descubrir</button>
<button class="action" data-id="fiesta">🐎<small>Fiesta</small>Jugar</button>
<button class="action" data-id="huellas">👣<small>Pasado</small>Buscar</button>
<button class="action" data-id="mapa">🗺️<small>Mapa</small>Mirar</button>
<button class="action" data-id="familia">❤️<small>Memoria</small>Guardar</button>
</nav>
<div class="menu" id="menu"><h1>🧭 Menú de Villa Picún</h1><p>Elegí cómo querés seguir la aventura.</p><div class="menuGrid">
<button class="menuItem" data-menu="missions">🎯 Misiones<span>Ver tu aventura</span></button>
<button class="menuItem" data-menu="history">📖 Línea del tiempo<span>Aprender jugando</span></button>
<button class="menuItem" data-menu="collection">⭐ Colección<span>Lo que descubriste</span></button>
<button class="menuItem" data-menu="how">🎮 Cómo jugar<span>Todo se toca</span></button>
</div><button class="close" id="menuClose">Volver al pueblo</button></div>
</section>
<footer>Villa Picún · una aventura familiar para descubrir y aprender</footer>
</main>
<script>
const data={
arroyo:["💧 El arroyo Picún Leufú","El arroyo forma parte de la identidad del lugar. La aventura empieza siguiendo el agua.","💡 Tocá “Explorar” otra vez para abrir una mini misión."],
chacra:["🌾 Día de chacra","La cultura del trabajo y la producción forman parte de la identidad de Picún Leufú. Ayudemos, cuidemos y aprendamos.","🎯 Misión: encontrá las tres pistas de la chacra."],
historia:["🏘️ Una historia que cambió de lugar","El antiguo asentamiento de Picún Leufú quedó afectado por el embalse y en 1971 se inauguró el nuevo asentamiento. La historia del pueblo también es la historia de su gente.","📖 En el menú podés recorrer esta historia en pequeñas escenas."],
sauce:["🌲 El Sauce","El Bosque Petrificado El Sauce está en el departamento Picún Leufú y fue declarado patrimonio cultural e histórico de la provincia en 2023.","🧭 Una futura misión permitirá conocer este lugar jugando."],
fiesta:["🐎 Fiesta del Chacarero y el Hombre de Campo","Es una celebración ligada a la gente, el trabajo chacarero, la vida de campo, artesanos, productores, música y tradiciones. Desde 2026 es Fiesta Provincial.","🎮 Próxima misión: preparar la fiesta."],
huellas:["👣 Un pasado muy antiguo","La zona guarda historias geológicas y paleontológicas que permiten viajar muchísimo más atrás que la historia del pueblo.","🔎 Buscá las huellas y descubrí qué pasó hace muchísimo tiempo."],
mapa:["🗺️ El mapa de la aventura","La próxima versión tendrá un mapa para viajar entre lugares y desbloquear nuevas historias.","🚧 Mapa en construcción: cada lugar será una pequeña aventura."],
familia:["❤️ La memoria del pueblo","Las familias, sus recuerdos y sus relatos pueden ayudar a construir una memoria viva del lugar.","🎙️ En una futura versión podremos sumar voces y recuerdos locales validados."]
};
const found=new Set(),score=document.getElementById("score"),missionText=document.getElementById("missionText"),bar=document.getElementById("bar"),panel=document.getElementById("panel"),pt=document.getElementById("pt"),px=document.getElementById("px"),extra=document.getElementById("extra"),toast=document.getElementById("toast"),mini=document.getElementById("mini"),menu=document.getElementById("menu");
function update(){score.textContent="⭐ "+Math.min(found.size,6)+" / 6";missionText.textContent=Math.min(found.size,6)+" de 6";bar.style.width=(Math.min(found.size,6)/6*100)+"%"}
function openPanel(t,x,e=""){pt.textContent=t;px.textContent=x;extra.innerHTML=e?'<div class="fact">'+e+'</div>':"";panel.classList.add("show")}
function discover(id){const d=data[id];if(!d)return;if(!found.has(id)){found.add(id);update();toast.style.display="block";setTimeout(()=>toast.style.display="none",1500)}openPanel(d[0],d[1],d[2]);if(id==="chacra")mini.classList.add("show")}
document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>discover(b.dataset.id));
document.getElementById("close").onclick=()=>panel.classList.remove("show");
document.getElementById("hero").onclick=()=>openPanel("👋 ¡Hola, explorador!","Soy tu compañero de aventura. Acá aprendemos tocando, buscando, hablando y jugando.","🎯 Tu misión es conocer Picún Leufú sin dejar de divertirte.");
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{b.disabled=true;b.style.opacity=".35";b.textContent="✓";if([...document.querySelectorAll("[data-t]")].every(x=>x.disabled)){mini.classList.remove("show");found.add("mini");toast.textContent="🎉 ¡Mini misión completa!";toast.style.display="block";setTimeout(()=>toast.style.display="none",1800)}});
document.getElementById("menuBtn").onclick=()=>menu.classList.add("show");document.getElementById("menuClose").onclick=()=>menu.classList.remove("show");
document.querySelectorAll("[data-menu]").forEach(b=>b.onclick=()=>{const k=b.dataset.menu;menu.classList.remove("show");if(k==="missions")openPanel("🎯 Misiones","Completá descubrimientos, mini juegos y aventuras para conocer el pueblo.");if(k==="history")openPanel("📖 Historia en 3 pasos","1. Un lugar y su gente. 2. Un pueblo afectado por el embalse. 3. El nuevo asentamiento inaugurado en 1971.","Aprenderemos cada etapa con imágenes, diálogos y juegos cortos.");if(k==="collection")openPanel("⭐ Tu colección","Cada lugar que descubrís queda marcado en tu aventura.","Próximamente: álbum de lugares, personajes, objetos y recuerdos.");if(k==="how")openPanel("🎮 Cómo jugar","Tocá todo. Hablá con los personajes. Buscá pistas. Completá misiones. Volvé a los lugares para descubrir cosas nuevas.","Está pensado para celular, tablet y computadora.");});
openPanel("🌊 Bienvenidos a Villa Picún","Tu primera misión es conocer el lugar jugando. Explorá el arroyo, las chacras, la historia, las fiestas y las huellas del pasado.","🎯 Consejo: tocá el menú ☰ cuando quieras ver tu progreso.");
</script>
</body></html>

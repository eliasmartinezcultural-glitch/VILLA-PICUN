<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#143d52">
<title>Villa Picún — La aventura comienza</title>
<style>
:root{--night:#143d52;--sky:#8ed5e8;--cream:#fff7df;--sand:#e7c98e;--green:#638d61;--deep:#17445b;--water:#4faec7;--yellow:#ffd45c;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--night);color:var(--deep)}
body{overflow-x:hidden}.game{min-height:100vh;display:flex;flex-direction:column}
.top{height:72px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;background:var(--night);color:#fff;position:relative;z-index:20}
.logo{font-weight:1000;letter-spacing:-1px;font-size:clamp(20px,5vw,32px)}.logo span{color:var(--yellow)}
.score{background:#fff;color:var(--night);border:3px solid var(--yellow);border-radius:999px;padding:7px 13px;font-weight:1000}
.world{position:relative;flex:1;min-height:680px;overflow:hidden;background:linear-gradient(var(--sky) 0 53%,var(--sand) 53% 72%,var(--water) 72% 100%)}
.sun{position:absolute;right:9%;top:7%;width:90px;height:90px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 12px #ffd45c44}
.mountain{position:absolute;bottom:43%;width:72%;height:29%;background:var(--green);border-radius:50% 50% 0 0/100% 100% 0 0;left:-12%;transform:rotate(-3deg)}
.mountain.b{left:45%;width:65%;height:25%;background:#557e5a;transform:rotate(4deg)}
.river{position:absolute;left:0;right:0;bottom:0;height:29%;background:var(--water);border-top:6px solid #dff8fa88}
.river:after{content:"";position:absolute;left:7%;top:22%;width:20%;height:5px;border-radius:9px;background:#ffffff88;box-shadow:160px 40px #ffffff66,420px 10px #ffffff55}
.path{position:absolute;left:42%;bottom:22%;width:22%;height:48%;background:#d5ad6d;transform:skew(-11deg);border-radius:50% 50% 0 0}
.reeds{position:absolute;bottom:27%;width:8px;height:65px;background:#4c704c;border-radius:8px;box-shadow:16px 13px #4c704c,-16px 8px #4c704c}
.r1{left:16%}.r2{right:15%}
.hero{position:absolute;z-index:8;left:46%;bottom:29%;width:92px;height:112px;cursor:pointer;animation:bob 1.7s ease-in-out infinite}
.hero .head{width:55px;height:55px;margin:auto;border-radius:50%;background:#d99b68;border:5px solid #173d50}
.hero .hat{width:66px;height:18px;background:#e9c15b;border:5px solid #173d50;border-radius:50%;margin-top:-7px;margin-left:13px;position:relative;z-index:2}
.hero .body{width:62px;height:57px;background:#356f8d;border:5px solid #173d50;border-radius:25px 25px 18px 18px;margin:0 auto}
.hero .leg{position:absolute;width:16px;height:35px;background:#3e4651;border:4px solid #173d50;border-radius:12px;bottom:0}.l{left:25px}.r{right:25px}
@keyframes bob{50%{transform:translateY(-9px) rotate(-1deg)}}
.bubble{position:absolute;z-index:10;left:50%;top:10%;transform:translateX(-50%);width:min(88%,620px);background:#fffdf4;border:4px solid var(--night);border-radius:26px;padding:16px 18px;text-align:center;box-shadow:0 10px 0 #173d5030;display:none}
.bubble.show{display:block;animation:pop .22s ease-out}.bubble h2{margin:0;font-size:clamp(22px,5vw,32px)}.bubble p{margin:6px 0 0;font-size:clamp(15px,3vw,19px);font-weight:650}
@keyframes pop{from{transform:translateX(-50%) scale(.8);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.actions{position:absolute;z-index:15;left:50%;bottom:25px;transform:translateX(-50%);width:min(94%,720px);display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button{font:inherit;font-weight:950;color:var(--night);background:#fff;border:4px solid var(--night);border-radius:20px;padding:13px 8px;min-height:70px;box-shadow:0 6px 0 #173d5044;cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #173d5044}
.card{position:absolute;z-index:16;left:50%;bottom:115px;transform:translateX(-50%);width:min(90%,560px);background:#fff;border:4px solid var(--night);border-radius:24px;padding:15px;display:none;box-shadow:0 12px 0 #173d5030}
.card.show{display:block}.card strong{font-size:20px}.card p{margin:5px 0 0;font-size:16px}.close{margin-top:10px;min-height:44px;width:100%;padding:7px}
footer{background:#fff7df;text-align:center;padding:10px;font-size:12px;font-weight:800}
@media(max-width:600px){.world{min-height:650px}.actions{grid-template-columns:1fr 1fr}.actions button:last-child{grid-column:1/-1}.hero{left:42%;transform:scale(.9)}.bubble{top:7%}}
</style>
</head>
<body>
<main class="game">
<header class="top"><div class="logo">VILLA <span>PICÚN</span></div><div class="score" id="score">⭐ 0 / 5</div></header>
<section class="world" aria-label="Aventura inicial">
<div class="sun"></div><div class="mountain"></div><div class="mountain b"></div><div class="path"></div><div class="river"></div><div class="reeds r1"></div><div class="reeds r2"></div>
<div class="hero" id="hero" aria-label="Explorador">
<div class="hat"></div><div class="head"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div>
</div>
<div class="bubble" id="bubble"><h2 id="bubbleTitle">¡Bienvenido!</h2><p id="bubbleText">Hoy vamos a jugar y descubrir historias de Picún Leufú.</p></div>
<div class="card" id="card"><strong id="cardTitle"></strong><p id="cardText"></p><button class="close" id="close">¡Seguir jugando!</button></div>
<div class="actions">
<button data-key="agua">💧<br>Buscar agua</button>
<button data-key="huellas">👣<br>Buscar huellas</button>
<button data-key="pueblo">🏘️<br>Conocer el pueblo</button>
<button data-key="familias">👨‍👩‍👧<br>Encontrar una historia</button>
<button data-key="tesoro">⭐<br>Buscar sorpresa</button>
</div>
</section>
<footer>Villa Picún · una historia para jugar · Ocarina Producciones</footer>
</main>
<script>
const items={
agua:["💧 ¡Encontraste el agua!","El agua acompaña la vida de este lugar. Mirá, escuchá y seguí explorando."],
huellas:["👣 ¡Huellas misteriosas!","Hay historias que empezaron muchísimo antes de nosotros. ¿Quién habrá pasado por acá?"],
pueblo:["🏘️ ¡Encontraste el pueblo!","Acá viven personas, familias, recuerdos y muchas historias para descubrir."],
familias:["👨‍👩‍👧 ¡Una historia familiar!","Las personas también guardan la memoria de un lugar. Cada recuerdo puede ser una aventura."],
tesoro:["⭐ ¡Sorpresa encontrada!","¡Completaste la primera búsqueda! Ahora Picún Leufú tiene más secretos para vos."]
};
const found=new Set(),score=document.getElementById("score"),card=document.getElementById("card"),ct=document.getElementById("cardTitle"),cx=document.getElementById("cardText"),bubble=document.getElementById("bubble");
function say(title,text){document.getElementById("bubbleTitle").textContent=title;document.getElementById("bubbleText").textContent=text;bubble.classList.add("show");clearTimeout(window.bt);window.bt=setTimeout(()=>bubble.classList.remove("show"),3200)}
function discover(key){if(!found.has(key)){found.add(key);score.textContent="⭐ "+found.size+" / 5"}ct.textContent=items[key][0];cx.textContent=items[key][1];card.classList.add("show");if(found.size===5)say("🎉 ¡Misión cumplida!","Encontraste las 5 sorpresas de la primera aventura.");}
document.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>discover(b.dataset.key));
document.getElementById("close").onclick=()=>card.classList.remove("show");
document.getElementById("hero").onclick=()=>say("👋 ¡Hola, explorador!","Tocá, buscá y descubrí. Acá la historia se aprende jugando.");
say("🌊 ¡Bienvenido a Villa Picún!","Tu primera misión: encontrar 5 sorpresas. ¡No hace falta leer mucho: explorá!");
</script>
</body></html>

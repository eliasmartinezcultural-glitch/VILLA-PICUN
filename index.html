<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Villa Picún — Una historia para jugar</title>
<style>
:root{--sky:#bfe8f4;--sand:#e8c98d;--water:#4ba9c8;--green:#6e9b62;--ink:#173044;--sun:#f5c85b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--sky);color:var(--ink)}
body{overflow-x:hidden}.game{min-height:100vh;position:relative;display:flex;flex-direction:column}
header{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:5}
.brand{font-weight:900;font-size:clamp(20px,4vw,34px);letter-spacing:-1px}.badge{background:#fff8;border:2px solid #fff;padding:7px 12px;border-radius:999px;font-weight:800}
.scene{position:relative;flex:1;min-height:560px;overflow:hidden;background:linear-gradient(#bfe8f4 0 55%,#d9bd7c 55% 100%)}
.sun{position:absolute;width:92px;height:92px;border-radius:50%;background:var(--sun);right:9%;top:8%;box-shadow:0 0 0 12px #f5c85b33}
.hill{position:absolute;bottom:27%;width:75%;height:34%;background:#809f6d;border-radius:50% 50% 0 0/100% 100% 0 0;left:-8%;transform:rotate(-3deg)}
.hill.two{width:70%;height:30%;left:43%;background:#718f63;transform:rotate(4deg)}
.water{position:absolute;bottom:0;left:0;width:100%;height:30%;background:var(--water);border-top:8px solid #eaf8fa66}
.path{position:absolute;bottom:0;left:42%;width:24%;height:48%;background:#d9b779;transform:skew(-12deg);opacity:.9}
.reed{position:absolute;bottom:23%;width:4px;height:60px;background:#52754c;border-radius:8px;box-shadow:12px 15px #52754c,-12px 8px #52754c}
.reed.a{left:18%}.reed.b{right:20%}
.character{position:absolute;bottom:24%;left:47%;font-size:76px;filter:drop-shadow(0 8px 4px #0002);animation:bob 2s ease-in-out infinite;cursor:pointer;z-index:3}
@keyframes bob{50%{transform:translateY(-8px)}} 
.controls{position:absolute;z-index:4;left:50%;bottom:30px;transform:translateX(-50%);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:min(92%,620px)}
button{border:0;border-radius:18px;padding:14px 18px;background:white;color:var(--ink);font-weight:900;font-size:16px;box-shadow:0 5px 0 #17304433;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 2px 0 #17304433}
.message{position:absolute;z-index:6;top:14%;left:50%;transform:translateX(-50%);width:min(88%,560px);background:#fffffff2;border:3px solid #fff;border-radius:24px;padding:18px;text-align:center;box-shadow:0 15px 40px #17304422;display:none}
.message.show{display:block}.message strong{font-size:23px}.message p{margin:7px 0 0;font-size:17px}
footer{padding:12px 18px;text-align:center;background:#fff;color:#355; font-size:13px}
@media(max-width:600px){.scene{min-height:600px}.character{font-size:64px;left:44%}.controls{bottom:22px}.sun{width:70px;height:70px}}
</style>
</head>
<body>
<main class="game">
<header><div class="brand">🌊 VILLA PICÚN</div><div class="badge">⭐ 0 descubrimientos</div></header>
<section class="scene" aria-label="Primera escena">
<div class="sun"></div><div class="hill"></div><div class="hill two"></div><div class="path"></div><div class="water"></div><div class="reed a"></div><div class="reed b"></div>
<div class="character" id="hero" title="Tocame">🧒</div>
<div class="message" id="message"><strong id="title">¡Hola, explorador!</strong><p id="text">Vamos a descubrir Picún Leufú jugando.</p></div>
<div class="controls">
<button data-find="agua">💧 Descubrir el agua</button>
<button data-find="huellas">🦖 Buscar huellas</button>
<button data-find="pueblo">🏘️ Conocer el pueblo</button>
</div>
</section>
<footer>Una historia para jugar · Proyecto Villa Picún · Ocarina Producciones</footer>
</main>
<script>
const badge=document.querySelector('.badge'),message=document.querySelector('#message'),title=document.querySelector('#title'),text=document.querySelector('#text');
let discoveries=0; const found=new Set();
const data={
agua:['💧 ¡Encontraste el agua!','El agua es parte de la historia y la vida de Picún Leufú.'],
huellas:['🦖 ¡Hay huellas!','En Picún Leufú podemos descubrir historias de un pasado muchísimo más antiguo.'],
pueblo:['🏘️ ¡Llegamos al pueblo!','Acá comienza nuestra aventura para conocer personas, lugares y recuerdos.']
};
function discover(key){if(!found.has(key)){found.add(key);discoveries++;badge.textContent='⭐ '+discoveries+' descubrimiento'+(discoveries===1?'':'s');}title.textContent=data[key][0];text.textContent=data[key][1];message.classList.add('show');setTimeout(()=>message.classList.remove('show'),4200)}
document.querySelectorAll('[data-find]').forEach(b=>b.addEventListener('click',()=>discover(b.dataset.find)));
document.querySelector('#hero').addEventListener('click',()=>{title.textContent='👋 ¡Hola!';text.textContent='Tocá los botones y empecemos a explorar Picún Leufú.';message.classList.add('show');});
</script>
</body></html>

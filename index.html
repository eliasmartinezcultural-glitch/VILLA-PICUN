<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173d50"><title>Villa Picún — Una historia para jugar</title>
<style>
:root{--ink:#173d50;--cream:#fff7df;--sky:#8ed7e8;--sand:#dfbd7b;--green:#668b5d;--water:#45a8c3;--sun:#ffd45b;--white:#fff;--red:#c96b55}
*{box-sizing:border-box}html,body{margin:0;background:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button{font:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}.top{height:68px;padding:9px 13px;display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;z-index:50}.brand{font-size:clamp(18px,5vw,30px);font-weight:1000;letter-spacing:-1px}.brand b{color:var(--sun)}.topRight{display:flex;gap:7px;align-items:center}.stars,.menuBtn{background:#fff;color:var(--ink);font-weight:1000;border:3px solid var(--sun);border-radius:999px;padding:7px 11px}.menuBtn{cursor:pointer;min-width:46px}
.world{position:relative;min-height:710px;flex:1;overflow:hidden;background:linear-gradient(var(--sky) 0 49%,var(--sand) 49% 70%,var(--water) 70%)}.sun{position:absolute;right:8%;top:6%;width:78px;height:78px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 12px #ffd45b44}.barda{position:absolute;bottom:40%;left:-12%;width:76%;height:27%;background:var(--green);border-radius:55% 55% 0 0}.barda.two{left:44%;width:68%;height:23%;background:#557a58;transform:rotate(3deg)}.river{position:absolute;bottom:0;width:100%;height:30%;background:var(--water);border-top:5px solid #e7fafb88}.river:after{content:"";position:absolute;top:25%;left:7%;width:18%;height:5px;border-radius:9px;background:#fff9;box-shadow:180px 32px #fff7,430px 5px #fff6}.road{position:absolute;bottom:20%;left:39%;width:25%;height:48%;background:#d4ab67;transform:skew(-12deg);border-radius:45% 45% 0 0}.reed{position:absolute;bottom:27%;width:7px;height:60px;background:#486d4b;border-radius:8px;box-shadow:15px 13px #486d4b,-14px 8px #486d4b}.reed.a{left:13%}.reed.b{right:14%}.sign{position:absolute;z-index:5;left:8%;bottom:32%;background:var(--cream);border:4px solid var(--ink);border-radius:12px;padding:7px 11px;font-weight:1000;box-shadow:0 5px #173d5033}.chacra{position:absolute;z-index:4;right:9%;bottom:34%;font-size:46px}.tree{position:absolute;z-index:4;right:26%;bottom:34%;font-size:54px}
.character{position:absolute;z-index:12;left:43%;bottom:29%;width:100px;height:125px;cursor:pointer;animation:float 1.8s ease-in-out infinite}.head{position:absolute;left:25px;top:13px;width:52px;height:52px;border-radius:50%;background:#d99b68;border:5px solid var(--ink)}.hair{position:absolute;left:25px;top:9px;width:52px;height:25px;background:#50382e;border:5px solid var(--ink);border-radius:50% 50% 35% 35%;z-index:2}.body{position:absolute;left:17px;top:64px;width:68px;height:56px;background:#c76d55;border:5px solid var(--ink);border-radius:24px}.leg{position:absolute;bottom:0;width:17px;height:38px;background:#384957;border:4px solid var(--ink);border-radius:10px}.leg.l{left:29px}.leg.r{right:29px}@keyframes float{50%{transform:translateY(-8px) rotate(1deg)}}
.mission{position:absolute;z-index:15;left:50%;top:15px;transform:translateX(-50%);width:min(92%,690px);background:#fffdf4;border:4px solid var(--ink);border-radius:20px;padding:10px 14px;box-shadow:0 7px #173d5030}.missionLine{display:flex;justify-content:space-between;gap:10px;align-items:center}.mission strong{font-size:15px}.mission small{font-weight:850}.bar{height:8px;background:#dbe5e3;border-radius:99px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--sun);transition:.25s}
.hud{position:absolute;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);width:min(96%,780px);display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.action{min-height:67px;border:4px solid var(--ink);border-radius:18px;background:#fff;color:var(--ink);font-weight:1000;box-shadow:0 6px #173d5033;cursor:pointer}.action:active{transform:translateY(4px);box-shadow:0 2px #173d5033}.action small{display:block;font-size:10px}
.panel,.menu{position:absolute;z-index:60;left:50%;top:8%;transform:translateX(-50%);width:min(93%,680px);background:#fffdf4;border:4px solid var(--ink);border-radius:25px;padding:17px;box-shadow:0 12px 0 #173d5033;text-align:center;display:none}.panel.show,.menu.show{display:block;animation:pop .2s}.panel h1,.menu h1{font-size:clamp(21px,5vw,31px);margin:0 0 6px}.panel p{margin:0;font-size:16px;font-weight:650;line-height:1.4}.close{margin-top:12px;width:100%;min-height:45px;background:var(--sun);border:3px solid var(--ink);border-radius:15px;font-weight:1000;cursor:pointer}
.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.menuItem{min-height:65px;background:#fff;border:3px solid var(--ink);border-radius:16px;font-weight:1000;cursor:pointer}.menuItem span{display:block;font-size:11px;font-weight:700}.dialogue{text-align:left;background:#eaf5f4;border:3px solid var(--ink);border-radius:18px;padding:12px;margin-top:10px}.dialogue b{display:block;margin-bottom:4px}.choices{display:grid;gap:8px;margin-top:10px}.choice{border:3px solid var(--ink);background:#fff;border-radius:14px;padding:11px;text-align:left;font-weight:850;cursor:pointer}.fact{margin-top:10px;background:#fff2bd;border:3px dashed var(--ink);border-radius:14px;padding:10px;font-size:14px;font-weight:800}
.mini{position:absolute;z-index:45;left:50%;bottom:120px;transform:translateX(-50%);width:min(92%,520px);background:var(--cream);border:4px solid var(--ink);border-radius:20px;padding:13px;text-align:center;display:none}.mini.show{display:block}.targets{display:flex;justify-content:center;gap:18px;margin:10px 0}.target{font-size:38px;border:0;background:transparent;cursor:pointer;transition:.12s}.target:active{transform:scale(.8)}.toast{position:absolute;z-index:70;left:50%;bottom:100px;transform:translateX(-50%);background:var(--cream);border:3px solid var(--ink);border-radius:15px;padding:8px 13px;font-weight:950;display:none}
@keyframes pop{from{transform:translateX(-50%) scale(.82);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
footer{background:var(--cream);padding:9px;text-align:center;font-size:11px;font-weight:800}
@media(max-width:620px){.world{min-height:680px}.hud{grid-template-columns:1fr 1fr}.action{min-height:61px}.character{left:38%;transform:scale(.9)}.menuGrid{grid-template-columns:1fr 1fr}.sign{left:3%;font-size:11px}.chacra{right:3%;font-size:37px}.tree{right:22%;font-size:43px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
<style>
#missionTitle{display:block;font-size:16px}.mission p{margin:3px 0 0;font-size:12px;font-weight:800}.missionPlace{opacity:.7}.taskGrid{display:grid;gap:8px;margin:12px 0}.task{border:3px solid var(--ink);background:#fff;border-radius:14px;padding:11px;text-align:left;font-weight:900;cursor:pointer}.task.done{background:#dff1df}.timelineItem{padding:10px;margin:7px 0;border:3px solid var(--ink);border-radius:13px;background:#fff;text-align:left}.timelineItem span{display:block;font-size:12px;margin-top:3px}.timelineItem.locked{opacity:.45}.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:10px;font-size:25px}.card b,.card small{display:block;font-size:12px}.card.got{background:#fff2bd}@media(max-width:620px){.mission{top:8px}.mission{padding:8px 11px}.mission strong{font-size:13px}}
</style></style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand">VILLA <b>PICÚN</b></div><div class="topRight"><div class="stars" id="score">⭐ 0 / 6</div><button class="menuBtn" id="menuBtn" aria-label="Abrir menú">☰</button></div></header>
<section class="world">
<div class="sun"></div><div class="barda"></div><div class="barda two"></div><div class="road"></div><div class="river"></div><div class="reed a"></div><div class="reed b"></div><div class="sign">PICÚN LEUFÚ</div><div class="chacra">🌾🐑</div><div class="tree">🌳</div>
<div class="mission"><div class="missionLine"><strong id="missionTitle">🎯 Misión 1</strong><small id="missionText">Misión 1 de 7</small></div><div class="missionPlace" id="missionPlace"></div><p id="missionGoal"></p><div class="bar"><i id="bar"></i></div></div>
<div class="character" id="hero" aria-label="Compañero de aventura"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div></div>
<div class="panel" id="panel"><h1 id="pt"></h1><p id="px"></p><div id="extra"></div><button class="close" id="close">¡Seguir jugando!</button></div>
<div class="mini" id="mini"><b>🎯 Mini misión: encontrá las 3 pistas</b><div class="targets"><button class="target" data-t="💧">💧</button><button class="target" data-t="👣">👣</button><button class="target" data-t="🌾">🌾</button></div><small>Tocá una por una.</small></div>
<div class="toast" id="toast">⭐ ¡Nuevo descubrimiento!</div>
<nav class="hud">
<button class="action" data-id="arroyo">💧<small>Arroyo</small>Explorar</button>
<button class="action" data-id="chacra">🌾<small>Chacras</small>Ayudar</button>
<button class="action" data-id="historia">🏘️<small>Historia</small>Viajar</button>
<button class="action" data-id="sauce">🌲<small>El Sauce</small>Descubrir</button>
<button class="action" data-id="fiesta">🐎<small>Fiesta</small>Jugar</button>
<button class="action" data-id="huellas">👣<small>Pasado</small>Buscar</button>
<button class="action" data-id="mapa">🗺️<small>Mapa</small>Mirar</button>
<button class="action" data-id="familia">❤️<small>Memoria</small>Guardar</button>
</nav>
<div class="menu" id="menu"><h1>🧭 Menú de Villa Picún</h1><p>Elegí cómo querés seguir la aventura.</p><div class="menuGrid">
<button class="menuItem" data-menu="missions">🎯 Misiones<span>Ver tu aventura</span></button>
<button class="menuItem" data-menu="history">📖 Línea del tiempo<span>Aprender jugando</span></button>
<button class="menuItem" data-menu="collection">⭐ Colección<span>Lo que descubriste</span></button>
<button class="menuItem" data-menu="how">🎮 Cómo jugar<span>Todo se toca</span></button>
</div><button class="close" id="menuClose">Volver al pueblo</button></div>
</section>
<footer>Villa Picún · una aventura familiar para descubrir y aprender</footer>
</main>
<script>
const missions=[
{id:1,icon:"💧",title:"Seguir el agua",place:"El arroyo Picún Leufú",goal:"Conocer el lugar donde comienza nuestra aventura.",intro:"El agua nos lleva a conocer Picún Leufú. Mirá, buscá y seguí sus pistas.",tasks:["Tocar el agua","Encontrar una pista","Hablar con tu compañero"],fact:"El arroyo Picún Leufú es un elemento real del territorio y sigue formando parte de la vida local.",next:"Ahora sabemos dónde estamos. Pero un pueblo también se construye con trabajo y vida cotidiana."},
{id:2,icon:"🌾",title:"La vida de las chacras",place:"Chacras y trabajo",goal:"Descubrir cómo el trabajo forma parte de la identidad local.",intro:"Entre agua, tierra y cortinas de álamos aparecen las chacras. ¡Ayudemos a ordenar el día!",tasks:["Regar","Encontrar los álamos","Guardar una cosecha"],fact:"En el área de Picún Leufú hay producción de pasturas, maíz y, en menor medida, frutales y nogales; también se usan álamos como cortinas rompevientos.",next:"Ya conocimos el lugar y su gente. Ahora viene una parte importante: el pueblo cambió de lugar."},
{id:3,icon:"🏘️",title:"Cuando el pueblo cambió",place:"La historia del asentamiento",goal:"Entender por qué aparece un nuevo Picún Leufú.",intro:"Hay dos momentos que tenemos que unir: el antiguo asentamiento y el nuevo pueblo.",tasks:["Ordenar ANTES","Encontrar el embalse","Ordenar 1971"],fact:"La historia local registra un cambio de asentamiento vinculado al embalse y el nuevo asentamiento de Picún Leufú fue inaugurado en 1971.",next:"El pueblo volvió a levantarse. Pero debajo de nuestros pies todavía quedaban historias muchísimo más antiguas."},
{id:4,icon:"👣",title:"Viaje al pasado",place:"Huellas y tiempo profundo",goal:"Viajar mucho más atrás que la historia del pueblo.",intro:"Antes de las calles y las casas, este territorio ya guardaba otras historias. Buscá las huellas.",tasks:["Encontrar una huella","Mirar el paisaje","Guardar el hallazgo"],fact:"La zona de Picún Leufú y El Sauce tiene interés paleontológico; existen trabajos y permisos oficiales de exploración y muestreo en el área.",next:"Descubrimos que Picún Leufú tiene muchas capas de historia. Ahora vamos a conocer un tesoro natural y cultural."},
{id:5,icon:"🌲",title:"El tesoro de El Sauce",place:"Bosque Petrificado El Sauce",goal:"Descubrir una parte protegida del patrimonio.",intro:"Llegamos a El Sauce. Hay que mirar con cuidado: algunos tesoros no hacen ruido, pero cuentan muchísimo.",tasks:["Encontrar el bosque","Leer una señal","Cuidar el lugar"],fact:"El Bosque Petrificado El Sauce fue declarado patrimonio cultural e histórico de la provincia y zona protegida de interés paleontológico en 2023.",next:"Ya conocemos agua, chacras, pueblo y pasado. Nos falta algo que une a muchas personas: celebrar y encontrarse."},
{id:6,icon:"🐎",title:"La gran fiesta",place:"Chacarero y Hombre de Campo",goal:"Reconocer la cultura, el trabajo y las tradiciones.",intro:"El pueblo se prepara. Hay música, campo, productores, artesanos y ganas de encontrarse. ¡Ayudá a preparar la fiesta!",tasks:["Preparar el escenario","Ayudar a un productor","Encontrar una tradición"],fact:"La Fiesta del Chacarero y el Hombre de Campo está vinculada a la vida rural, el trabajo, artesanos, productores y tradiciones; en 2026 fue declarada Fiesta Provincial.",next:"Ya recorrimos una historia. Ahora podemos armar nuestro propio recuerdo de Picún Leufú."},
{id:7,icon:"❤️",title:"Nuestra historia",place:"El álbum de Picún Leufú",goal:"Unir todo lo aprendido y llegar al final de la aventura.",intro:"Agua, chacras, cambios, huellas, patrimonio y fiesta. Todo forma parte de una misma historia: la de un lugar y su gente.",tasks:["Completar el álbum","Elegir tu recuerdo","Abrir el final"],fact:"Una historia local se vuelve más viva cuando también conserva las voces, recuerdos y miradas de quienes habitan el lugar.",next:"¡Llegaste al final! Pero la historia de Picún Leufú sigue cada vez que alguien la conoce, la cuenta y la cuida."}
];
const state=JSON.parse(localStorage.getItem("villaPicunState")||'{"mission":1,"found":[]}');
const found=new Set(state.found||[]), score=document.getElementById("score"), missionText=document.getElementById("missionText"), bar=document.getElementById("bar"), panel=document.getElementById("panel"),pt=document.getElementById("pt"),px=document.getElementById("px"),extra=document.getElementById("extra"),toast=document.getElementById("toast"),mini=document.getElementById("mini"),menu=document.getElementById("menu");
let active=state.mission||1;
function save(){localStorage.setItem("villaPicunState",JSON.stringify({mission:active,found:[...found]}))}
function current(){return missions[active-1]}
function update(){
 const done=Math.max(0,active-1); score.textContent="⭐ "+done+" / 7"; missionText.textContent="Misión "+active+" de 7"; bar.style.width=(done/7*100)+"%";
 document.getElementById("missionTitle").textContent=current().icon+" "+current().title;
 document.getElementById("missionGoal").textContent=current().goal;
 document.getElementById("missionPlace").textContent=current().place;
 save();
}
function openPanel(t,x,e="",actions=""){pt.textContent=t;px.textContent=x;extra.innerHTML=(e?'<div class="fact">'+e+"</div>":"")+actions;panel.classList.add("show")}
function completeMission(n){
 if(n!==active)return;
 found.add("m"+n); if(active<7){active++;toast.textContent="🔓 ¡Misión "+active+" desbloqueada!";toast.style.display="block";setTimeout(()=>toast.style.display="none",1800);update();showMissionIntro()}else{update();openFinal()}
}
function showMissionIntro(){const m=current();openPanel("🎯 Misión "+active+": "+m.title,m.intro,m.fact,'<button class="close" id="startMission">¡Empezar misión!</button>');document.getElementById("startMission").onclick=()=>{panel.classList.remove("show");startMini()}}
function startMini(){
 const m=current();mini.innerHTML='<b>'+m.icon+" "+m.title+'</b><p style="margin:5px 0;font-weight:800">'+m.goal+'</p><div class="taskGrid">'+m.tasks.map((x,i)=>'<button class="task" data-i="'+i+'">○ '+x+'</button>').join("")+'</div><small>Completá las 3 tareas para avanzar.</small>';mini.classList.add("show");
 const buttons=[...mini.querySelectorAll(".task")]; buttons.forEach(b=>b.onclick=()=>{b.disabled=true;b.textContent="✓ "+m.tasks[+b.dataset.i];b.classList.add("done");if(buttons.every(x=>x.disabled)){mini.classList.remove("show");if(active===7)openFinal();else completeMission(active)}})
}
function openFinal(){openPanel("🏁 ¡Llegaste al final!","Completaste las 7 misiones y recorriste una historia de Picún Leufú: el agua, las chacras, el cambio del pueblo, el pasado profundo, El Sauce, la fiesta y la memoria.","❤️ Ahora la aventura queda en tus manos: conocer, contar y cuidar Picún Leufú.","<button class='close' id='restart'>Volver a recorrer la historia</button>");document.getElementById("restart").onclick=()=>{active=1;found.clear();save();update();panel.classList.remove("show");showMissionIntro()}}
function openHistory(){const list=missions.map((m,i)=>'<div class="timelineItem '+(i+1>active?"locked":"")+'"><b>'+m.icon+" "+(i+1)+". "+m.title+"</b><span>"+(i+1<active?"✓ Completada":i+1===active?"▶ Actual":"🔒 Se desbloquea jugando")+"</span></div>").join("");openPanel("📖 La historia en 7 misiones","Cada misión agrega una pieza. No hace falta leer todo: jugá y la historia aparece mientras avanzás.", "",list)}
function openCollection(){const cards=missions.map((m,i)=>'<div class="card '+(found.has("m"+(i+1))?"got":"")+'">'+(found.has("m"+(i+1))?m.icon:"🔒")+'<b>'+m.title+"</b><small>"+(found.has("m"+(i+1))?m.place:"Descubrilo jugando")+"</small></div>").join("");openPanel("⭐ Mi colección","Cada misión completada guarda un recuerdo.", "",'<div class="cards">'+cards+"</div>")}
document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{const id=b.dataset.id;if(id==="historia")showMissionIntro();else if(id==="mapa")openHistory();else if(id==="familia")openCollection();else{const m=current();openPanel(m.icon+" "+m.title,m.intro,m.fact,'<button class="close" id="goMission">Jugar misión</button>');document.getElementById("goMission").onclick=()=>{panel.classList.remove("show");startMini()}}});
document.getElementById("close").onclick=()=>panel.classList.remove("show");
document.getElementById("hero").onclick=()=>openPanel("👋 Soy tu compañero","Yo te acompaño por las 7 misiones. No te voy a contar todo de golpe: vamos a descubrirlo jugando.","🎯 Completá una misión para desbloquear la siguiente.");
document.getElementById("menuBtn").onclick=()=>menu.classList.add("show");document.getElementById("menuClose").onclick=()=>menu.classList.remove("show");
document.querySelectorAll("[data-menu]").forEach(b=>b.onclick=()=>{menu.classList.remove("show");const k=b.dataset.menu;if(k==="missions")showMissionIntro();if(k==="history")openHistory();if(k==="collection")openCollection();if(k==="how")openPanel("🎮 Cómo jugar","Hay 7 misiones. Cada una tiene 3 tareas simples. Cuando las completás, la historia avanza y se desbloquea la siguiente.","📱 Funciona en celular, tablet y computadora. Tocá, buscá, elegí y jugá.")});
document.getElementById("close").onclick=()=>panel.classList.remove("show");
update(); if(!sessionStorage.getItem("welcome")){sessionStorage.setItem("welcome","1");showMissionIntro();}
</script>
</body></html>

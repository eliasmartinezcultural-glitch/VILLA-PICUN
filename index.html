<title>VILLA PICÚN — Una historia para jugar</title>
<style>
:root{--ink:#183b4b;--paper:#fff8e8;--sun:#ffd35c;--water:#3ea7c2;--earth:#c99b5e;--green:#65875d;--sky:#9bdceb;--red:#c76e58;--white:#fff;--shadow:0 8px 0 #183b4b22}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--ink);color:var(--ink)}button{font:inherit}
button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}.app{min-height:100vh;display:flex;flex-direction:column;background:var(--ink)}
.top{height:68px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;z-index:100}.brand{font-weight:1000;font-size:clamp(20px,5vw,30px);letter-spacing:-1px}.brand b{color:var(--sun)}.topRight{display:flex;gap:7px}.pill,.iconBtn{border:3px solid var(--sun);background:#fff;color:var(--ink);border-radius:999px;font-weight:1000;padding:7px 11px}.iconBtn{cursor:pointer;min-width:45px}
.game{position:relative;flex:1;min-height:720px;overflow:hidden;background:#9bdceb}
.scene{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#9bdceb 0 48%,#d5b16d 48% 70%,#3ea7c2 70%);transition:.35s}.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 12%,#ffd35c 0 38px,transparent 40px)}
.land{position:absolute;left:-8%;right:-8%;bottom:25%;height:29%;background:var(--green);border-radius:50% 50% 0 0}.land.b{left:40%;bottom:27%;height:23%;background:#52745b;transform:rotate(3deg)}.water{position:absolute;left:0;right:0;bottom:0;height:30%;background:var(--water);border-top:5px solid #ffffff55}.road{position:absolute;bottom:19%;left:42%;width:20%;height:47%;background:#d1a663;transform:skew(-12deg);border-radius:45% 45% 0 0}.sign{position:absolute;left:6%;bottom:32%;z-index:6;background:var(--paper);border:4px solid var(--ink);padding:7px 11px;border-radius:12px;font-weight:1000;box-shadow:var(--shadow)}
.scene.sunset:before{background:radial-gradient(circle at 82% 12%,#ffb85b 0 38px,transparent 40px)}.scene.night{background:linear-gradient(#244a65 0 50%,#86674b 50% 70%,#285f72 70%)}.scene.night:before{background:radial-gradient(circle at 82% 12%,#fff4b8 0 27px,transparent 29px)}
.overlayTitle{position:absolute;z-index:20;left:50%;top:16px;transform:translateX(-50%);width:min(92%,700px);background:#fffdf5eF;border:4px solid var(--ink);border-radius:20px;padding:10px 14px;box-shadow:var(--shadow)}
.chapter{display:flex;align-items:center;gap:8px}.chapter .num{background:var(--ink);color:#fff;border-radius:10px;padding:3px 8px;font-weight:1000}.chapter strong{font-size:clamp(15px,4vw,20px)}.place{font-size:12px;font-weight:850;opacity:.72}.goal{font-size:13px;font-weight:800;margin-top:3px}.progress{height:8px;background:#dfe7e2;border-radius:99px;margin-top:7px;overflow:hidden}.progress i{display:block;height:100%;background:var(--sun);transition:.35s}
.hotspots{position:absolute;z-index:25;inset:0;pointer-events:none}.spot{position:absolute;pointer-events:auto;border:4px solid var(--ink);background:#fff;color:var(--ink);border-radius:18px;padding:8px 11px;font-weight:1000;box-shadow:var(--shadow);cursor:pointer;animation:bob 2.2s ease-in-out infinite}.spot small{display:block;font-size:10px;font-weight:750}.s1{left:8%;bottom:40%}.s2{right:8%;bottom:39%;animation-delay:.3s}.s3{left:44%;bottom:48%;animation-delay:.6s}
.character{position:absolute;z-index:30;left:50%;bottom:27%;transform:translateX(-50%);width:105px;height:140px;cursor:pointer;filter:drop-shadow(0 8px 0 #183b4b22)}.head{position:absolute;left:27px;top:8px;width:53px;height:53px;border:5px solid var(--ink);border-radius:50%;background:#d89a68}.hair{position:absolute;left:27px;top:5px;width:53px;height:26px;border:5px solid var(--ink);border-radius:50% 50% 35% 35%;background:#4e382f;z-index:2}.body{position:absolute;left:17px;top:61px;width:70px;height:61px;border:5px solid var(--ink);border-radius:25px;background:var(--red)}.leg{position:absolute;bottom:0;width:18px;height:39px;border:4px solid var(--ink);border-radius:10px;background:#384957}.leg.l{left:28px}.leg.r{right:28px}.character:hover{transform:translateX(-50%) scale(1.04)}@keyframes bob{50%{transform:translateY(-7px)}}
.sceneArt{position:absolute;z-index:4;font-size:54px}.art1{left:14%;bottom:33%}.art2{right:16%;bottom:34%}
.hud{position:absolute;z-index:50;left:50%;bottom:14px;transform:translateX(-50%);width:min(96%,820px);display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.hud button{min-height:64px;border:4px solid var(--ink);border-radius:17px;background:#fff;color:var(--ink);font-weight:1000;box-shadow:var(--shadow);cursor:pointer}.hud button small{display:block;font-size:10px;opacity:.7}.hud button:active{transform:translateY(4px);box-shadow:0 3px 0 #183b4b22}
.dialog{position:absolute;z-index:80;left:50%;top:14%;transform:translateX(-50%);width:min(93%,670px);background:#fffdf5;border:4px solid var(--ink);border-radius:24px;padding:17px;box-shadow:0 14px 0 #183b4b33;display:none}.dialog.show{display:block;animation:pop .2s}.dialog h1{font-size:clamp(21px,5vw,31px);margin:0 0 5px}.dialog p{font-size:16px;line-height:1.4;font-weight:650;margin:0}.fact{margin-top:10px;padding:10px;background:#fff0bd;border:3px dashed var(--ink);border-radius:14px;font-size:13px;font-weight:800}.dialog button{width:100%;min-height:45px;margin-top:11px;border:3px solid var(--ink);border-radius:14px;background:var(--sun);font-weight:1000;cursor:pointer}
.menu{position:absolute;z-index:90;inset:0;background:#183b4bf2;display:none;padding:70px 15px 20px;overflow:auto}.menu.show{display:block}.menuBox{width:min(94%,680px);margin:auto;background:var(--paper);border:4px solid var(--ink);border-radius:25px;padding:18px;box-shadow:0 15px #0003}.menuBox h1{margin:0;font-size:27px}.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.menuGrid button{min-height:72px;background:#fff;border:3px solid var(--ink);border-radius:15px;font-weight:1000;cursor:pointer}.menuGrid small{display:block;font-weight:700}.settings{margin-top:12px;border-top:3px solid #183b4b22;padding-top:12px}.settings h2{font-size:16px;margin:0 0 8px}.settingsGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.settingsGrid button{min-height:54px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-weight:1000;cursor:pointer}.danger{background:#ffe2dc!important}.menuClose{width:100%;margin-top:10px;min-height:46px;border:3px solid var(--ink);border-radius:14px;background:var(--sun);font-weight:1000}
.taskPanel{position:absolute;z-index:70;left:50%;bottom:105px;transform:translateX(-50%);width:min(93%,570px);background:var(--paper);border:4px solid var(--ink);border-radius:22px;padding:14px;box-shadow:0 12px #183b4b33;display:none}.taskPanel.show{display:block}.taskPanel h2{margin:0 0 4px}.taskPanel p{margin:0;font-weight:750}.tasks{display:grid;gap:8px;margin-top:11px}.task{border:3px solid var(--ink);border-radius:13px;background:#fff;padding:11px;text-align:left;font-weight:900;cursor:pointer}.task.done{background:#dcefd9}.task:disabled{cursor:default}
.start{position:absolute;z-index:200;inset:0;background:linear-gradient(180deg,#9bdceb 0%,#fff0b5 58%,#3ea7c2 100%);display:flex;align-items:center;justify-content:center;padding:18px}.startBox{width:min(94%,650px);text-align:center;background:#fffdf5;border:5px solid var(--ink);border-radius:30px;padding:25px 18px;box-shadow:0 15px #183b4b33}.logo{font-weight:1000;font-size:clamp(34px,10vw,65px);letter-spacing:-3px}.logo span{color:#d47b50}.startBox h2{margin:3px 0 8px;font-size:clamp(18px,5vw,26px)}.startBox p{font-weight:700;line-height:1.4}.startBtn{width:100%;min-height:56px;border:4px solid var(--ink);border-radius:17px;background:var(--sun);font-weight:1000;font-size:18px;cursor:pointer}.continue{margin-top:8px;background:#fff}.timeline,.collection{margin-top:10px}.timelineItem,.card{padding:10px;margin:7px 0;border:3px solid var(--ink);border-radius:13px;background:#fff;text-align:left}.timelineItem span{display:block;font-size:12px}.locked{opacity:.45}.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{margin:0;font-size:25px}.card b,.card small{display:block;font-size:12px}.toast{position:absolute;z-index:150;left:50%;bottom:98px;transform:translateX(-50%);background:var(--paper);border:3px solid var(--ink);border-radius:15px;padding:8px 13px;font-weight:1000;display:none}
footer{background:var(--paper);text-align:center;padding:8px;font-size:10px;font-weight:850}
@keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
@media(max-width:620px){.game{min-height:700px}.hud{grid-template-columns:1fr 1fr}.hud button{min-height:60px}.overlayTitle{top:8px}.character{bottom:29%;transform:translateX(-50%) scale(.88)}.spot{font-size:12px}.sceneArt{font-size:42px}.dialog{top:11%}.menuGrid{grid-template-columns:1fr 1fr}}
.lowGraphics *{animation:none!important;transition:none!important}.lowGraphics .sceneArt{filter:none}.lowGraphics .spot{box-shadow:none}.lowGraphics .hud button{box-shadow:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand">VILLA <b>PICÚN</b></div><div class="topRight"><div class="pill" id="score">⭐ 0 / 7</div><button class="iconBtn" id="menuBtn">☰</button></div></header>
<section class="game" id="game">
<div class="scene" id="scene">
<div class="land"></div><div class="land b"></div><div class="road"></div><div class="water"></div><div class="sign">PICÚN LEUFÚ</div>
<div class="overlayTitle"><div class="chapter"><span class="num" id="mNum">1</span><strong id="mTitle"></strong></div><div class="place" id="mPlace"></div><div class="goal" id="mGoal"></div><div class="progress"><i id="progress"></i></div></div>

<div class="menu" id="menu"><div class="menuBox"><h1>🧭 Villa Picún</h1><p>Todo pertenece a la misma aventura.</p><div class="menuGrid">
<button data-menu="missions">🎯 Misiones<small>Tu recorrido</small></button><button data-menu="history">📖 Historia<small>Lo que vas aprendiendo</small></button><button data-menu="collection">⭐ Álbum<small>Tus recuerdos</small></button><button data-menu="how">🎮 Cómo jugar<small>La aventura</small></button>
</div><div class="settings"><h2>⚙️ Ajustes</h2><div class="settingsGrid">
<button id="restartBtn">↻ Reiniciar<small>Empezar de cero</small></button>
<button id="soundBtn">🔊 Sonido: ON<small>Toques y avisos</small></button>

</div></div>
<button class="menuClose" id="menuClose">Volver al juego</button></div></div>
</div>
<nav class="hud" id="hud"></nav>
<div class="start" id="start"><div class="startBox"><div class="logo">VILLA <span>PICÚN</span></div><h2>Una historia para jugar</h2><p>Un viaje familiar por Picún Leufú.<br><b>Jugá. Descubrí. Aprendé. Avanzá.</b></p><button class="startBtn" id="play">▶ EMPEZAR AVENTURA</button><button class="startBtn continue" id="continue" style="display:none">↻ CONTINUAR AVENTURA</button></div></div>
</section>
<footer>Villa Picún · una aventura familiar sobre un lugar, su historia y su gente</footer>
</main>
<script>
const missions=[
{title:"Seguir el agua",place:"El arroyo Picún Leufú",goal:"Encontrá el comienzo de nuestra historia.",theme:"water",art:["💧","🌿"],intro:"El viaje empieza por el agua. Caminamos, miramos el paisaje y descubrimos por qué este lugar existe alrededor de su territorio.",fact:"Picún Leufú se encuentra junto a la desembocadura del arroyo homónimo y sobre la ribera del embalse Ezequiel Ramos Mexía.",spots:[["💧","Seguir el agua","Mirá la corriente"],["🌿","Mirar el paisaje","Buscá una pista"],["👋","Hablar","Conocé a tu compañero"]],tasks:["Encontrar el agua","Descubrir una pista","Hablar con el compañero"]},
{title:"La vida que alimenta al pueblo",place:"Chacras y trabajo",goal:"Descubrí cómo agua, tierra y trabajo se encuentran.",theme:"field",art:["🌾","🌳"],intro:"Seguimos el recorrido hacia las chacras. Acá la historia no está en un libro: está en la tierra, el trabajo y las personas.",fact:"Documentación provincial describe el área de Picún Leufú con actividad agrícola y ganadera y sectores periurbanos próximos al arroyo.",spots:[["🌾","Chacra","Ayudá con la cosecha"],["🌳","Álamos","Encontrá la cortina"],["🧺","Cosecha","Guardá el recuerdo"]],tasks:["Regar la chacra","Encontrar los álamos","Guardar una cosecha"]},
{title:"Cuando el pueblo tuvo que cambiar",place:"El antiguo y el nuevo asentamiento",goal:"Uní las piezas para entender el cambio.",theme:"history",art:["🏘️","🌊"],intro:"Ahora la aventura cambia. Tenemos que mirar el pasado del pueblo y entender cómo el embalse transformó el territorio.",fact:"La historia del asentamiento y su relación con el embalse debe presentarse en el juego con fuentes locales validadas; el nuevo asentamiento fue inaugurado en 1971.",spots:[["🏚️","Antes","Encontrá el viejo pueblo"],["🌊","Embalse","Descubrí qué cambió"],["🏘️","1971","Llegá al nuevo pueblo"]],tasks:["Encontrar el ANTES","Comprender el cambio","Ordenar 1971"]},
{title:"Mucho antes de nosotros",place:"Huellas y tiempo profundo",goal:"Viajá muchísimo más atrás en el tiempo.",theme:"past",art:["👣","🦴"],intro:"El viaje se aleja del pueblo. Antes de las casas, las calles y las chacras, el territorio ya guardaba otras historias.",fact:"El departamento Picún Leufú posee sitios y patrimonio de interés paleontológico; El Sauce está reconocido legalmente como zona protegida.",spots:[["👣","Huellas","Buscá una señal"],["🦴","Pasado","Observá con cuidado"],["🔎","Explorar","Guardá el hallazgo"]],tasks:["Encontrar una huella","Observar el paisaje","Guardar el hallazgo"]},
{title:"El tesoro de El Sauce",place:"Bosque Petrificado El Sauce",goal:"Descubrí un patrimonio que hay que cuidar.",theme:"sauce",art:["🌲","🪵"],intro:"Llegamos a uno de los capítulos más especiales. No venimos a llevarnos nada: venimos a mirar, aprender y cuidar.",fact:"La Ley provincial 3392 declaró patrimonio cultural e histórico al Bosque Petrificado El Sauce y estableció una zona paleontológica excluyente y protegida.",spots:[["🌲","El Sauce","Entrá al capítulo"],["🪵","Piedra y tiempo","Observá"],["🛡️","Cuidar","Protegé el lugar"]],tasks:["Encontrar el bosque","Descubrir su historia","Elegir cómo cuidarlo"]},
{title:"El pueblo se encuentra",place:"Fiesta del Chacarero y el Hombre de Campo",goal:"Viví una celebración que reúne trabajo e identidad.",theme:"party",art:["🐎","🎶"],intro:"Después de recorrer la historia, llega el encuentro. Prepará la fiesta y descubrí cómo se mezclan campo, trabajo, música y comunidad.",fact:"En 2026 la Fiesta del Chacarero y el Hombre de Campo de Picún Leufú fue declarada Fiesta Provincial. La norma destaca trabajo chacarero, cultura de campo, artesanos, productores y tradiciones.",spots:[["🐎","Campo","Prepará la jornada"],["🎶","Música","Sumá una tradición"],["🧺","Productores","Ayudá a compartir"]],tasks:["Preparar la fiesta","Encontrar una tradición","Ayudar a un productor"]},
{title:"Nuestra historia",place:"El álbum de Picún Leufú",goal:"Uní todo lo que descubriste y llegá al final.",theme:"final",art:["❤️","📖"],intro:"Llegaste hasta acá. Agua, trabajo, cambio, pasado, patrimonio y encuentro. Ahora todas las piezas forman una sola historia.",fact:"El final del juego no pretende cerrar la historia real: invita a seguir conociendo, contando y cuidando Picún Leufú.",spots:[["📖","Álbum","Ordená tus recuerdos"],["❤️","Memoria","Elegí uno"],["🏁","Final","Abrí la última escena"]],tasks:["Completar el álbum","Elegir tu recuerdo","Abrir el final"]}
];
const state=JSON.parse(localStorage.getItem("villaPicunGame")||'{"mission":1,"done":[]}');let active=state.mission||1;let done=new Set(state.done||[]);
let settings=JSON.parse(localStorage.getItem("villaPicunSettings")||'{"sound":true,"graphics":"high","language":"es"}');
const AudioCtx=window.AudioContext||window.webkitAudioContext;let audioCtx=null;
function beep(freq=520,duration=.07){if(!settings.sound||!AudioCtx)return;try{audioCtx=audioCtx||new AudioCtx();if(audioCtx.state==="suspended")audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type="sine";g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}
function saveSettings(){localStorage.setItem("villaPicunSettings",JSON.stringify(settings))}
function applySettings(){document.body.classList.toggle("lowGraphics",settings.graphics==="low");document.getElementById("soundBtn").innerHTML=(settings.sound?"🔊":"🔇")+" Sonido: "+(settings.sound?"ON":"OFF")+"<small>Toques y avisos</small>";document.getElementById("graphicsBtn").innerHTML="🎨 Gráficos: "+(settings.graphics==="high"?"ALTO":"SIMPLE")+"<small>Animaciones</small>";document.getElementById("languageBtn").innerHTML="🌎 Idioma: "+(settings.language==="es"?"ES":"EN")+"<small>"+(settings.language==="es"?"Español":"English · interfaz")+"</small>";}

const scene=document.getElementById("scene"),hud=document.getElementById("hud"),hotspots=document.getElementById("hotspots"),taskPanel=document.getElementById("taskPanel"),dialog=document.getElementById("dialog"),dialogTitle=document.getElementById("dialogTitle"),dialogText=document.getElementById("dialogText"),dialogExtra=document.getElementById("dialogExtra"),toast=document.getElementById("toast"),menu=document.getElementById("menu");
function save(){localStorage.setItem("villaPicunGame",JSON.stringify({mission:active,done:[...done]}))}
function m(){return missions[active-1]}
function update(){
 const x=m();document.getElementById("mNum").textContent=active;document.getElementById("mTitle").textContent=x.title;document.getElementById("mPlace").textContent=x.place;document.getElementById("mGoal").textContent=x.goal;document.getElementById("progress").style.width=((active-1)/7*100)+"%";document.getElementById("score").textContent="⭐ "+done.size+" / 7";
 scene.className="scene scene-"+x.theme;document.getElementById("art1").textContent=x.art[0];document.getElementById("art2").textContent=x.art[1];
 hotspots.innerHTML=x.spots.map((s,i)=>'<button class="spot s'+(i+1)+'" data-spot="'+i+'">'+s[0]+' '+s[1]+'<small>'+s[2]+'</small></button>').join("");
 hud.innerHTML='<button id="missionBtn">🎯<small>Ahora</small>Misión</button><button id="dialogBtn">💬<small>Hablar</small>Compañero</button><button id="albumBtn">⭐<small>Guardar</small>Álbum</button><button id="menuOpen">☰<small>Ver</small>Menú</button>';
 document.querySelectorAll("[data-spot]").forEach(b=>b.onclick=()=>spot(+b.dataset.spot));document.getElementById("missionBtn").onclick=startMission;document.getElementById("dialogBtn").onclick=companion;document.getElementById("albumBtn").onclick=collection;document.getElementById("menuOpen").onclick=()=>menu.classList.add("show");save();
}
function show(t,x,f="",button="Seguir"){dialogTitle.textContent=t;dialogText.textContent=x;dialogExtra.innerHTML=f?'<div class="fact">'+f+"</div>":"";document.getElementById("dialogClose").textContent=button;dialog.classList.add("show")}
function closeDialog(){dialog.classList.remove("show")}
document.getElementById("dialogClose").onclick=closeDialog;
function companion(){show("👋 Tu compañero","No te voy a contar la historia entera. La vamos a descubrir juntos. Cada vez que completás una misión, el mundo cambia y aparece un nuevo capítulo.","La regla de Villa Picún: jugar primero, entender después y recordar siempre.")}
function spot(i){const x=m().spots[i];show(x[0]+" "+x[1],x[2]+". "+m().intro,"🎯 Esta pista pertenece a la misión "+active+" de 7.")}
function startMission(){closeDialog();const x=m();taskPanel.innerHTML='<h2>'+x.art[0]+' '+x.title+'</h2><p>'+x.goal+'</p><div class="tasks">'+x.tasks.map((t,i)=>'<button class="task" data-task="'+i+'">○ '+t+'</button>').join("")+'</div>';taskPanel.classList.add("show");const bs=[...taskPanel.querySelectorAll(".task")];bs.forEach(b=>b.onclick=()=>{b.disabled=true;b.classList.add("done");b.textContent="✓ "+x.tasks[+b.dataset.task];if(bs.every(q=>q.disabled))finishMission()})}
function finishMission(){beep(820,.12);taskPanel.classList.remove("show");done.add(active);save();if(active<7){const old=active;active++;save();toast.textContent="🔓 Capítulo "+active+" desbloqueado";toast.style.display="block";setTimeout(()=>toast.style.display="none",1600);update();show("✨ Misión "+old+" completada","Lo que descubriste ya forma parte de tu historia. Ahora el camino continúa.","Siguiente capítulo: "+m().title,"Continuar")}
else{update();show("🏁 FIN DE LA AVENTURA","Completaste las 7 misiones de Villa Picún. La historia que jugaste une territorio, gente, memoria y patrimonio.","❤️ La historia real sigue viva fuera del juego: en las personas, los lugares y los recuerdos.","Volver a jugar")}}
function history(){const list=missions.map((x,i)=>'<div class="timelineItem '+(i+1>active?"locked":"")+'"><b>'+x.art[0]+' '+(i+1)+". "+x.title+'</b><span>'+(done.has(i+1)?"✓ Completada":i+1===active?"▶ En curso":"🔒 Se desbloquea jugando")+"</span></div>").join("");show("📖 El recorrido", "Siete capítulos. Una sola historia. Cada misión abre la siguiente.",list)}
function collection(){const cards=missions.map((x,i)=>'<div class="card '+(done.has(i+1)?"got":"")+'">'+(done.has(i+1)?x.art[0]:"🔒")+'<b>'+x.title+'</b><small>'+(done.has(i+1)?x.place:"Todavía no")+"</small></div>").join("");show("⭐ Álbum de viaje","Cada misión completada deja una pieza del recuerdo.","<div class='cards'>"+cards+"</div>")}
function how(){show("🎮 Cómo se juega","Todo ocurre dentro del mismo viaje. El paisaje cambia según el capítulo, los botones siempre tienen la misma lógica y las misiones hacen avanzar la historia.","📱 Pensado para celular, tablet y computadora. Tocá, hablá, explorá y completá tres tareas.")}
document.getElementById("menuClose").onclick=()=>{menu.classList.remove("show");beep(500)};

document.querySelectorAll("[data-menu]").forEach(b=>b.onclick=()=>{menu.classList.remove("show");if(b.dataset.menu==="missions")startMission();if(b.dataset.menu==="history")history();if(b.dataset.menu==="collection")collection();if(b.dataset.menu==="how")how()});
document.getElementById("hero").onclick=()=>{beep(640);companion()};document.getElementById("menuBtn").onclick=()=>{beep(500);menu.classList.add("show")};
document.addEventListener("pointerdown",e=>{if(e.target.closest("button"))beep(430,.035)},{passive:true});
applySettings();
function restartGame(){if(!confirm("¿Reiniciar toda la aventura? Se borrará el progreso guardado."))return;localStorage.removeItem("villaPicunGame");active=1;done=new Set();menu.classList.remove("show");taskPanel.classList.remove("show");closeDialog();document.getElementById("start").style.display="flex";document.getElementById("continue").style.display="none";document.getElementById("play").textContent="▶ EMPEZAR AVENTURA";update();beep(260,.12)}
document.getElementById("restartBtn").onclick=restartGame;
document.getElementById("soundBtn").onclick=()=>{settings.sound=!settings.sound;saveSettings();applySettings();beep(620,.08)};
document.getElementById("graphicsBtn").onclick=()=>{settings.graphics=settings.graphics==="high"?"low":"high";saveSettings();applySettings();beep(560,.08)};
document.getElementById("languageBtn").onclick=()=>{settings.language=settings.language==="es"?"en":"es";saveSettings();applySettings();show(settings.language==="es"?"🌎 Español":"🌎 English","El juego conserva su contenido histórico en español. La opción cambia la interfaz principal y queda guardada en este dispositivo.","Idioma seleccionado.");beep(700,.08)};
function launch(){document.getElementById("start").style.display="none";update();show("🎯 Misión 1 — Seguir el agua",m().intro,m().fact,"¡Empezar!")}
document.getElementById("play").onclick=launch;document.getElementById("continue").onclick=launch;
if(state.mission>1||state.done.length){document.getElementById("continue").style.display="block";document.getElementById("play").textContent="↻ NUEVA AVENTURA"}update();
</script>
</body>
</html>
